group = com.github.godark14.composerecompositionauditor
version = 0.0.1

pluginRepositoryUrl = https://github.com/Godark14/compose-recomposition-auditor

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 261
pluginUntilBuild = 261.*

# Android Studio Quail 4 | 2026.1.4 — Build #AI-261.26222.65.2614.16204760
platformVersion = 2026.1.4

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
# JVM memory for the Gradle daemon — needed when compiling against
# the full Android Studio classpath via local()
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# JVM memory for the Kotlin compile daemon specifically
kotlin.daemon.jvmargs=-Xmx4096m